name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    # no deployment for changes that don't affect the website
    paths-ignore:
      - "**.md"
      - "tests/**"
      - ".devcontainer/**"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "tests/**"
      - ".devcontainer/**"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"

jobs:
  # A merged pull request with the label "no-deploy" (e.g. a refactoring) is not
  # deployed to production; its changes go live with the next deployment.
  check_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Check for the no-deploy label
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.labels.outputs.skip }}
    steps:
      - name: Labels of the merged pull request
        id: labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[].labels[].name] | join(",")')
          echo "Labels: ${labels:-none}"
          if [[ ",$labels," == *",no-deploy,"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped: the pull request has the label no-deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build_and_deploy_job:
    needs: check_deploy_job
    # PR previews always; production unless the check says skip
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.check_deploy_job.result == 'success' && needs.check_deploy_job.outputs.skip != 'true') ||
        (github.event_name == 'pull_request' && github.event.action != 'closed')
      )
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          IS_STATIC_EXPORT: true
          # Google Tag Manager only on production, not in PR previews (repository variable PUBLIC_GTM_ID)
          NEXT_PUBLIC_GTM_ID: ${{ github.event_name == 'push' && vars.PUBLIC_GTM_ID || '' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_GRASS_06127B803 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          # api_location: "" # Api source code path - optional
          output_location: "/out" # Built app content directory - optional
          # Dependabot PRs have no access to the deploy token: build, but skip the preview deployment
          skip_deploy_on_missing_secrets: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_GRASS_06127B803 }}
          action: "close"
